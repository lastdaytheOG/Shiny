android.useAndroidX=true
android.newDsl=false
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g


# Flow Neuroengine

# Listen Together session server (server/together), deployed 2026-09-27.
shiny.together.url=https://shiny-together.shinymusic.workers.dev

# SOURCE_CODE_URL: the one place the source location is set. Settings > About > Source code opens
# it, and it is where the licence, the notices and the third-party licences are read. GPL-3.0
# section 6 requires the Corresponding Source of every APK handed out, so this address must be
# publicly reachable before an APK is given to anyone. A value that is not an https:// URL is
# treated as unset and hides the row. See LICENSE_COMPLIANCE.md.
shiny.sourceCodeUrl=https://github.com/lastdaytheOG/Shiny
