name: Something is broken
description: A crash, a song that won't play, or anything that behaves wrongly
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: Say what you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The shortest list of taps that leads to the problem. Name the song or playlist if it only happens with one.
      placeholder: |
        1. Open Library → Downloaded
        2. Tap Smart Shuffle
        3. The second song never starts
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shiny version
      description: Settings → About. Add whether it's the gms or foss build if you know.
      placeholder: 1.2.4 (gms)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Galaxy S23, Android 15
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Connection when it happened
      options:
        - Wi-Fi
        - Mobile data
        - Offline
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
      description: Optional. Drag files in here. Check that logs hold nothing private before attaching them.
