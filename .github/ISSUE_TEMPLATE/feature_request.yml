name: Idea
description: Something Shiny should do, or do better
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the moment you wished Shiny worked differently. That helps more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: A sketch or a screenshot from another app is welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Home / New
        - Search
        - Library and downloads
        - Now Playing and lyrics
        - Listen Together and friends
        - Settings and appearance
        - Widgets, Android Auto or notifications
        - Somewhere else
  - type: textarea
    id: today
    attributes:
      label: How do you manage today?
      description: Optional. A workaround, or another app that already does this.
